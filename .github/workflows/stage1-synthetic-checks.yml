name: Stage 1 synthetic checks

on:
  push:
    branches:
      - handoff/stage1-baseline-freeze
  pull_request:
    paths:
      - "scripts/check_stage1_artifacts.py"
      - "scripts/verify_stacking_aggregates.py"
      - "scripts/validate_test_predictions.py"
      - "scripts/predict.py"
      - "tests/test_stage1_freeze.py"
      - ".github/workflows/stage1-synthetic-checks.yml"

permissions:
  contents: read

jobs:
  stage1-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m py_compile scripts/check_stage1_artifacts.py scripts/verify_stacking_aggregates.py scripts/validate_test_predictions.py scripts/predict.py tests/test_stage1_freeze.py
      - name: Privacy-safe synthetic regression
        run: python -m unittest discover -s tests -p 'test_stage1_freeze.py' -v


  corrected-stacking-aggregate:
    needs: stage1-synthetic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install aggregate-only dependencies
        run: python -m pip install "numpy>=1.23" "pandas>=1.5" "scikit-learn>=1.2,<2.0" "scipy>=1.9"
      - name: Recompute corrected Stacking summaries (no row-level exports)
        run: |
          python scripts/analyze_stacking_errors.py \
            --input results/oof_fusion/novel_fusion_predictions.csv \
            --output-dir "$RUNNER_TEMP/stacking_corrected" \
            --fusion-config results/oof_fusion/fusion_config.json \
            --bootstrap-reps 2000 --seed 42 --aggregate-only
      - name: Verify paired counts, bootstrap and standardized AUC/AP
        run: |
          python scripts/verify_stacking_aggregates.py \
            --analysis-dir "$RUNNER_TEMP/stacking_corrected" \
            --reference results/oof_fusion/metrics_comparison.csv \
            --summary-out "$RUNNER_TEMP/stacking_verified.json"
