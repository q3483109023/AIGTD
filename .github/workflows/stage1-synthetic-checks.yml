name: Stage 1 synthetic checks

on:
  push:
    branches:
      - handoff/stage1-baseline-freeze
  pull_request:
    paths:
      - "scripts/check_stage1_artifacts.py"
      - "scripts/verify_stacking_aggregates.py"
      - "scripts/validate_test_predictions.py"
      - "scripts/predict.py"
      - "tests/test_stage1_freeze.py"
      - ".github/workflows/stage1-synthetic-checks.yml"

permissions:
  contents: read

jobs:
  stage1-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m py_compile scripts/check_stage1_artifacts.py scripts/verify_stacking_aggregates.py scripts/validate_test_predictions.py scripts/predict.py tests/test_stage1_freeze.py
      - name: Privacy-safe synthetic regression
        run: python -m unittest discover -s tests -p 'test_stage1_freeze.py' -v
